<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Apply theme before paint to avoid a flash of the wrong mode. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('cyklos_theme') || 'system'
          var dark = true
          if (stored === 'light') dark = false
          else if (stored === 'dark') dark = true
          else dark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var theme = dark ? 'dark' : 'light'
          document.documentElement.setAttribute('data-theme', theme)
          document.documentElement.style.colorScheme = theme
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>

    <!-- Manrope for UI, Cormorant Garamond for display, IBM Plex Mono for data -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <meta name="theme-color" content="#080711" />
    <meta
      name="description"
      content="Ask a question. Get an answer calculated from your birth chart."
    />
    <title>Cyklos — Beyond the beginning</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
